name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          unzip -q portfolio-site.zip -d _site
          cp -R site/. _site/
          node --test tests/navigation-boundary.test.mjs
          cat video-parts/*.bin > _site/assets/journey.mp4
          sed -i 's|https://robson-portfolio.sistemas-robson.chatgpt.site/assets/journey.mp4|./assets/journey.mp4|g' _site/index.html
          test -s _site/index.html
          test "$(wc -c < _site/assets/journey.mp4)" -eq 8885935
          test "$(dd if=_site/assets/journey.mp4 bs=1 skip=4 count=4 2>/dev/null)" = ftyp
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
