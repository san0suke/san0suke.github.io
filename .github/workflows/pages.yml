name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          unzip -q portfolio-site.zip -d _site
          curl --fail --location --retry 3 --max-time 180 \
            https://robson-portfolio.sistemas-robson.chatgpt.site/assets/journey.mp4 \
            --output _site/assets/journey.mp4
          sed -i 's|https://robson-portfolio.sistemas-robson.chatgpt.site/assets/journey.mp4|./assets/journey.mp4|g' _site/index.html
          test -s _site/index.html
          test -s _site/assets/journey.mp4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
